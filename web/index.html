<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Pipeline Console</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">◧</span> Pipeline Console</div>
      <nav id="nav" class="nav">
        <a data-route="prepipeline"><span class="nav-i">①</span> Pre-Pipeline</a>
        <a data-route="execution"><span class="nav-i">②</span> Execution</a>
        <a data-route="forecast"><span class="nav-i">③</span> Forecast</a>
        <a data-route="cohorts"><span class="nav-i">◷</span> Cohorts</a>
        <a data-route="deals"><span class="nav-i">▤</span> Deals</a>
        <a data-route="scorecard"><span class="nav-i">★</span> Rep Scorecard</a>
        <a data-route="settings"><span class="nav-i">⚙</span> Settings</a>
      </nav>
      <div class="sidebar-foot">
        <div class="muted small">Window</div>
        <div id="window-label">—</div>
        <div class="muted small" style="margin-top:8px">Last sync</div>
        <div id="last-sync">never</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="page-title">Pre-Pipeline</h1>
          <p id="page-sub" class="muted small"></p>
        </div>
        <div class="topbar-actions">
          <button id="flags-btn" class="chip" title="Open flags">⚑ <span id="flags-count">—</span></button>
          <button id="sync-btn" class="btn-primary">Sync now</button>
        </div>
      </header>
      <div id="sync-bar" class="sync-bar hidden">
        <div class="sync-track"><div id="sync-fill" class="sync-fill"></div></div>
        <span id="sync-label" class="small"></span>
      </div>
      <section id="view" class="view"><div class="loading">Loading…</div></section>
    </main>
  </div>

  <div id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-head">
      <strong>Flags</strong>
      <button id="drawer-close" class="icon-btn">✕</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <button id="modal-close" class="icon-btn modal-close">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="overlay" class="overlay hidden"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
